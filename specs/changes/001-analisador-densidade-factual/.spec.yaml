subagents:
  approved: true
  note: >-
    Paralelizável SOMENTE depois que M1 congelar os arquivos de porta em
    src/core/ports/. Antes disso os componentes compartilham os tipos de domínio
    e paralelizar cria conflito.
  components:
    - name: adapter-extracao
      scope: "HttpContentFetcher + ReadabilityExtractor: buscar URL e extrair conteúdo principal"
      files: "src/adapters/fetch/**, src/adapters/extract/**, tests/adapters/extract/**"
      constraints: "Não tocar em src/core/**, src/adapters/classify/**, src/app/**"
    - name: adapter-segmentacao
      scope: "IntlSentenceSegmenter: segmentar texto em sentenças analisáveis"
      files: "src/adapters/segment/**, tests/adapters/segment/**"
      constraints: "Não tocar em src/core/**, outros adapters"
    - name: adapter-prefiltro-regras
      scope: "RulePrefilter + tabelas de sinais PT-BR: classificação determinística"
      files: "src/adapters/classify/rule-prefilter.ts, src/adapters/classify/signals/**, tests/adapters/classify/rules/**"
      constraints: "Não tocar em claude-classifier.ts nem hybrid-classifier.ts"
    - name: adapter-classificador-llm
      scope: "ClaudeClassifier: classificação via messages.parse + zodOutputFormat"
      files: "src/adapters/classify/claude-classifier.ts, src/adapters/classify/prompts/**, tests/adapters/classify/llm/**"
      constraints: "Não tocar em rule-prefilter.ts; consumir apenas a porta ClaimClassifier"

